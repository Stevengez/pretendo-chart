{{- if .Values.mongo.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
          env:
            - name: GLIBC_TUNABLES
              value: glibc.pthread.rseq=1
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until mongosh --port 27017 --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1; do
                      sleep 1
                    done
                    mongosh --port 27017 --quiet --eval "try { rs.status() } catch(err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
spec:
  ports:
    - port: 27017
      targetPort: mongo
      protocol: TCP
      name: mongo
  selector:
    app: mongo
{{- end }}
