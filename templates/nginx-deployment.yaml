{{- if .Values.nginx.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskndo.fullname" . }}-nginx
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
    app: {{ include "taskndo.fullname" . }}-nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "taskndo.fullname" . }}-nginx
  template:
    metadata:
      labels:
        app: {{ include "taskndo.fullname" . }}-nginx
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "taskndo.fullname" . }}-nginx-config
        - name: certs
          secret:
            secretName: {{ .Values.nginx.tls.secretName | quote }}
{{- end }}
