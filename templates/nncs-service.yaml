{{- if .Values.nncs.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: nncs
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nncs.service.type | default "NodePort" }}
  ports:
    - port: 10025
      targetPort: primary
      protocol: UDP
      name: primary
      nodePort: 10025
    - port: 10125
      targetPort: secondary
      protocol: UDP
      name: secondary
      nodePort: 10125
    - port: 33334
      targetPort: unknown-33334
      protocol: UDP
      name: unknown-33334
      nodePort: 33334
    - port: 33335
      targetPort: unknown-33335
      protocol: UDP
      name: unknown-33335
      nodePort: 33335
  selector:
    app: nncs
{{- end }}
