{{- if .Values.miiverseWeb.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: miiverse-web
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.miiverseWeb.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: miiverse-web
{{- end }}
