{{- if .Values.account.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: account
  labels:
    {{- include "taskndo.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.global.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.account.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: account
          port: {{ .Values.account.service.httpPort }}
{{- end }}
